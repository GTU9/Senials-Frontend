server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # ── API 프록시 (/senials/api/ → Spring Boot, 프리픽스 제거) ──────────
    location /senials/api/ {
        proxy_pass http://backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 백엔드 서빙 이미지 (업로드 파일 - 취미/파티/프로필) ──────────────
    location ~ ^/senials/img/(hobbyboard|partyboard|userProfile)/ {
        rewrite ^/senials(/img/.*)$ $1 break;
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── React SPA (정적파일 우선, 없으면 index.html 폴백) ────────────────
    location /senials/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ @spa_fallback;
    }

    location @spa_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ── React 코드의 절대경로 /img/, /image/ 처리 ────────────────────────
    location /img/ {
        root /usr/share/nginx/html;
        try_files $uri @backend_root_img;
    }
    location /image/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location @backend_root_img {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── /senials (슬래시 없음) → /senials/ 리다이렉트 ────────────────────
    location = /senials {
        return 301 $scheme://$http_host/senials/;
    }

    # ── 루트 접근 시 /senials/ 로 리다이렉트 ─────────────────────────────
    location = / {
        return 301 $scheme://$http_host/senials/;
    }
}
